<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crownring - Quotes</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="page">
  <span class="title">Quotes</span>
  <div id="divLegend">
    <div><div style="background:#ebeeff"></div> Converted to Order</div>
    <div><div style="background:#f0d9d9"></div> Approved by client</div>
    <div><div style="background:#f0f0f0"></div> Pending</div>
  </div>
  <div class="addLinks">
    <div><img src="https://www.crownring.com/_admin/images/plus.gif" alt="+" width="11" height="11" onerror="this.replaceWith('+ ')"><a href="quoteEdit.html?quoteID=0">To Add a New Quote, Click Here</a></div>
    <div><img src="https://www.crownring.com/_admin/images/plus.gif" alt="+" width="11" height="11" onerror="this.replaceWith('+ ')"><a href="#" id="lnkAddCBR">To Add a New Custom Bridal Quote, Click Here</a></div>
  </div>
  <form id="f" onsubmit="return false">
    <div class="filterRow">
      <label>Quote#<br><input type="text" name="SM_val" style="width:80px"></label>
      <label>Ref#<br><input type="text" name="CBRID" style="width:80px"></label>
      <label>Company name<br><input type="text" name="company" id="company" class="hmSearchField" style="width:220px"></label>
      <label>From<br><input type="date" name="dateQuotedFrom"></label>
      <label>To<br><input type="date" name="dateQuotedTo"></label>
      <label><input type="checkbox" name="viewConverted"> View Converted Quotes</label>
      <label><input type="checkbox" name="viewExpired"> View Expired Quotes Only</label>
      <span><button type="button" id="btnOk">Ok</button> <button type="button" id="btnReset">Reset</button></span>
    </div>
  </form>
  <div id="divTabs">
    <a href="?viewCBR=0" id="tabReg">Quotes</a>
    <a href="?viewCBR=1" id="tabCBR">Custom Bridal Quotes</a>
  </div>
  <div class="pager">Page <select id="pgSel"></select> <a class="action" id="pgNext">&gt;&gt;</a> <span id="pgInfo" class="muted"></span></div>
  <div class="exportLink" id="divExport"><a class="action" id="btnExport">Export Bridal Quotes</a></div>
  <div id="divList"></div>
</div>
<script src="assets/js/data/live-lookups.js"></script>
<script src="assets/js/data/lookups.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/data/accounts.js"></script>
<script src="assets/js/data/rates.js"></script>
<script src="assets/js/pricing.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/list.js"></script>
</body>
</html>
